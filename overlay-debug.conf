#
# naulaTAG — bring-up / debug overlay
#
# Turns the logging that prj.conf strips for production back on, over Segger
# RTT so no pins or UART are needed.  Build with:
#
#     west build -b naulaTAG_v1/nrf54l15/cpuapp -- -DEXTRA_CONF_FILE=overlay-debug.conf
#
# Then attach with `JLinkRTTViewer`, or `west attach` / nRF Connect's terminal.
#
# Do NOT measure battery current with this overlay applied — logging and a live
# debug transport dominate the idle current and the numbers will be meaningless.
# Flash a plain `west build` image for any power measurement.
#

CONFIG_LOG=y
# 0=off 1=ERR 2=WRN 3=INF 4=DBG
CONFIG_LOG_DEFAULT_LEVEL=4

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Deferred logging keeps the measurement path from blocking on RTT writes; the
# log thread drains the buffer once the workqueue is idle again.
CONFIG_LOG_MODE_DEFERRED=y

# Assertions catch the BTHome payload-length check in ble.c and Zephyr's own
# internal invariants.  Worth the flash during bring-up, not in production.
CONFIG_ASSERT=y

# Fault handlers print a usable register dump and stack trace instead of
# silently resetting.
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
