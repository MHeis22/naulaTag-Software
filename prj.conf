#
# naulaTAG project configuration — PRODUCTION
# Target: nRF54L15, IoT temperature/humidity meter with e-ink display
#
# This file is the shipping configuration: no logging, no RTT, no console.  On
# this SoC a build left with debug and logging enabled idles around two orders
# of magnitude above the sleep current, which turns a multi-year battery life
# into months.
#
# For bring-up and debugging, add the overlay:
#     west build -b naulaTAG_v1/nrf54l15/cpuapp -- -DEXTRA_CONF_FILE=overlay-debug.conf
#

# ── GPIO / I2C / SPI ──────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y

# ── Watchdog ──────────────────────────────────────────────────────────
# Last-resort recovery: the display path can block the system workqueue, and a
# device that stops measuring must reboot itself rather than sit there flat.
CONFIG_WATCHDOG=y

# ── Sensors ───────────────────────────────────────────────────────────
CONFIG_SENSOR=y

# HDC3022 temperature+humidity (NCS 3.x driver)
CONFIG_TI_HDC302X=y

# OPT3005 light sensor (register-compatible with OPT3001).
# Trigger support is deliberately NOT enabled: the threshold interrupt requires
# the sensor to convert continuously (1.8-3.7 uA against 0.3 uA in shutdown) and
# would hold a third GPIOTE channel open.  main.c drives the sensor in
# single-shot mode over I2C instead and reads it every 10 minutes.
CONFIG_OPT300X=y

# ── Persistent storage ────────────────────────────────────────────────
# ZMS rather than NVS: it is designed for non-erasable media like the nRF54L's
# RRAM, where NVS would emulate erases by writing 0xFF and waste write cycles.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y

# ── Power management ──────────────────────────────────────────────────
# CONFIG_PM stays off on purpose — see the comment at the top of main.c.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ── Clocks: use 32.768 kHz XTAL for RTC / low-power sleep ─────────────
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# ── Bluetooth ─────────────────────────────────────────────────────────
# Default state is a short non-connectable BTHome v2 burst after each
# measurement; the BLE button opens a 30 s connectable window backed by the
# Environmental Sensing and Battery services.  See ble.c.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="naulaTAG"
# 768 = Generic Sensor (Bluetooth appearance value)
CONFIG_BT_DEVICE_APPEARANCE=768
CONFIG_BT_MAX_CONN=1

# Battery Service — ble.c pushes a level derived from the SAADC VDD reading.
CONFIG_BT_BAS=y

# ── Stack sizes ───────────────────────────────────────────────────────
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# ── No console, no logging, no debug transport ────────────────────────
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n
