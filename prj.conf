#
# naulaTAG project configuration
# Target: nRF54L15, IoT temperature/humidity meter with e-ink display
#

# ── GPIO / I2C / SPI ──────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# ── Sensors ───────────────────────────────────────────────────────────
CONFIG_SENSOR=y

# HDC3022 temperature+humidity (NCS 3.x driver)
CONFIG_TI_HDC302X=y

# OPT3005 light sensor (register-compatible with OPT3001)
CONFIG_OPT300X=y
CONFIG_OPT300X_TRIGGER_GLOBAL_THREAD=y

# ── Power management ──────────────────────────────────────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ── Clocks: use 32.768 kHz XTAL for RTC / low-power sleep ─────────────
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# ── Bluetooth (on-demand only — not auto-advertised) ──────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="naulaTAG"
# 768 = Generic Sensor (Bluetooth appearance value)
CONFIG_BT_DEVICE_APPEARANCE=768
CONFIG_BT_MAX_CONN=1

CONFIG_REQUIRES_FLOAT_PRINTF=y

# ── Stack sizes ───────────────────────────────────────────────────────
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# ── Logging via Segger RTT ────────────────────────────────────────────
CONFIG_LOG=y
# 3 = INF, 4 = DBG
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable RTT backend
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Explicitly disable UART to save power and pins
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n